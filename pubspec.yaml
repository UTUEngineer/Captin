dependency_overrides:
  xml: ^7.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_native_splash: 2.4.8
  build_runner: 2.5.4
  riverpod_generator: ^2.6.5
  freezed: ^3.0.6
  json_serializable: ^6.9.5
