name: captain
description: "Captain — tactical football analysis app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  go_router: ^15.1.2
  shared_preferences: ^2.5.3
  pdf: ^3.11.3
  gal: ^2.3.1
  dio: ^5.9.0
  file_picker: ^10.1.2
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  http: ^1.2.2
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  supabase_flutter: ^2.15.0
  flutter_dotenv: ^6.0.1
  qr_flutter: ^4.1.0
  image: ^4.9.1
